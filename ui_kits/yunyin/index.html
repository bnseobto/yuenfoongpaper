<script type="text/babel" data-presets="env,react">
  // hide boot splash once root has content (check immediately + observe)
  const root = document.getElementById('root');
  const hide = () => document.getElementById('boot').classList.add('gone');
  if (root.children.length) hide();
  else {
    const obs = new MutationObserver(() => { if (root.children.length) { hide(); obs.disconnect(); } });
    obs.observe(root, { childList: true })
