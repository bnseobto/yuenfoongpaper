<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/yunyin/styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--paper-50);color:var(--n-900);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .b{height:48px;border-radius:9px;border:1px solid rgba(0,0,0,.06)}
.sw .l{font:var(--overline);color:var(--n-muted);letter-spacing:.02em}
.sw .h{font-family:var(--font-mono);font-size:11px;color:var(--n-700)}
.rowsw{display:flex;gap:10px}
.rowsw>*{flex:1}
.lbl{font:var(--overline);letter-spacing:.1em;text-transform:uppercase;color:var(--orange-600);margin:0 0 14px}
.chiprow{display:flex;gap:12px;flex-wrap:wrap}.semi{flex:1;min-width:120px;border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}.semi .t{font-weight:700;font-size:14px}.semi .s{font-family:var(--font-mono);font-size:11px;opacity:.8}
</style></head><body><p class="lbl">Semantic · 語意色</p><div class="chiprow">
<div class="semi" style="background:#FCEBEC;color:#A60D1E"><span class="t">Danger 印前錯誤 / 安全</span><span class="s">#CF1226</span></div>
<div class="semi" style="background:#FEF4E2;color:#B9830A"><span class="t">Warning 注意</span><span class="s">#E0A416</span></div>
<div class="semi" style="background:#E7F6EF;color:#15784F"><span class="t">Success 印刷就緒</span><span class="s">#1E9E6A</span></div>
<div class="semi" style="background:#EAF3F6;color:#226478"><span class="t">Info 提示</span><span class="s">#2E7D95</span></div></div></body></html>
