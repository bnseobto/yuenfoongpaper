<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/yunyin/styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--paper-50);color:var(--n-900);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .b{height:48px;border-radius:9px;border:1px solid rgba(0,0,0,.06)}
.sw .l{font:var(--overline);color:var(--n-muted);letter-spacing:.02em}
.sw .h{font-family:var(--font-mono);font-size:11px;color:var(--n-700)}
.rowsw{display:flex;gap:10px}
.rowsw>*{flex:1}
.lbl{font:var(--overline);letter-spacing:.1em;text-transform:uppercase;color:var(--orange-600);margin:0 0 14px}
.spb{display:flex;flex-direction:column;gap:8px}.spr{display:flex;align-items:center;gap:10px}.spr .bar{height:14px;background:var(--orange-400);border-radius:3px}.spr .n{font:var(--caption);color:var(--n-muted);font-family:var(--font-mono)}
</style></head><body><p class="lbl">Spacing · 4px base</p><div class="spb">
<div class="spr"><div class="bar" style="width:4px"></div><div class="n">sp-1 · 4px</div></div><div class="spr"><div class="bar" style="width:8px"></div><div class="n">sp-2 · 8px</div></div><div class="spr"><div class="bar" style="width:12px"></div><div class="n">sp-3 · 12px</div></div><div class="spr"><div class="bar" style="width:16px"></div><div class="n">sp-4 · 16px</div></div><div class="spr"><div class="bar" style="width:24px"></div><div class="n">sp-6 · 24px</div></div><div class="spr"><div class="bar" style="width:32px"></div><div class="n">sp-8 · 32px</div></div><div class="spr"><div class="bar" style="width:48px"></div><div class="n">sp-12 · 48px</div></div></div></body></html>
