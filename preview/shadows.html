<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/yunyin/styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--paper-50);color:var(--n-900);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .b{height:48px;border-radius:9px;border:1px solid rgba(0,0,0,.06)}
.sw .l{font:var(--overline);color:var(--n-muted);letter-spacing:.02em}
.sw .h{font-family:var(--font-mono);font-size:11px;color:var(--n-700)}
.rowsw{display:flex;gap:10px}
.rowsw>*{flex:1}
.lbl{font:var(--overline);letter-spacing:.1em;text-transform:uppercase;color:var(--orange-600);margin:0 0 14px}
.shr{display:flex;gap:20px}.shr>div{flex:1;text-align:center}.shc{height:60px;background:var(--paper-0);border-radius:14px;margin-bottom:10px}.shn{font:var(--overline);color:var(--n-muted)}
</style></head><body><p class="lbl">Elevation · 暖調陰影</p><div class="shr">
<div><div class="shc" style="box-shadow:var(--sh-sm)"></div><div class="shn">sm</div></div>
<div><div class="shc" style="box-shadow:var(--sh-md)"></div><div class="shn">md</div></div>
<div><div class="shc" style="box-shadow:var(--sh-lg)"></div><div class="shn">lg</div></div>
<div><div class="shc" style="box-shadow:var(--sh-xl)"></div><div class="shn">xl</div></div></div></body></html>
