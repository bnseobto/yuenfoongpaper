<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/yunyin/styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--paper-50);color:var(--n-900);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .b{height:48px;border-radius:9px;border:1px solid rgba(0,0,0,.06)}
.sw .l{font:var(--overline);color:var(--n-muted);letter-spacing:.02em}
.sw .h{font-family:var(--font-mono);font-size:11px;color:var(--n-700)}
.rowsw{display:flex;gap:10px}
.rowsw>*{flex:1}
.lbl{font:var(--overline);letter-spacing:.1em;text-transform:uppercase;color:var(--orange-600);margin:0 0 14px}
.lr{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.box{padding:16px 20px;border-radius:14px;display:flex;align-items:center;gap:14px}
</style></head><body><p class="lbl">Logo</p><div class="lr">
<div class="box" style="background:var(--paper-0);border:1px solid var(--n-200)"><img src="../assets/yunyin-logo.png" style="height:40px"></div>
<div class="box" style="background:var(--paper-0);border:1px solid var(--n-200)"><img src="../assets/yunyin-logomark.png" style="height:44px"></div></div></body></html>
