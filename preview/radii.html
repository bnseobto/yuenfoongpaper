<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/yunyin/styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--paper-50);color:var(--n-900);font-family:var(--font-sans)}
.sw{display:flex;flex-direction:column;gap:6px}
.sw .b{height:48px;border-radius:9px;border:1px solid rgba(0,0,0,.06)}
.sw .l{font:var(--overline);color:var(--n-muted);letter-spacing:.02em}
.sw .h{font-family:var(--font-mono);font-size:11px;color:var(--n-700)}
.rowsw{display:flex;gap:10px}
.rowsw>*{flex:1}
.lbl{font:var(--overline);letter-spacing:.1em;text-transform:uppercase;color:var(--orange-600);margin:0 0 14px}
.rb{display:flex;gap:14px;align-items:flex-end}.rb>div{flex:1;text-align:center}.rb .x{height:56px;background:var(--teal-100);border:1px solid var(--teal-300)}.rb .n{font:var(--overline);color:var(--n-muted);margin-top:6px}
</style></head><body><p class="lbl">Corner Radii</p><div class="rb">
<div><div class="x" style="border-radius:6px"></div><div class="n">sm · 6px</div></div><div><div class="x" style="border-radius:10px"></div><div class="n">md · 10px</div></div><div><div class="x" style="border-radius:14px"></div><div class="n">lg · 14px</div></div><div><div class="x" style="border-radius:20px"></div><div class="n">xl · 20px</div></div><div><div class="x" style="border-radius:28px"></div><div class="n">2xl · 28px</div></div><div><div class="x" style="border-radius:999px"></div><div class="n">pill · 999px</div></div></div></body></html>
