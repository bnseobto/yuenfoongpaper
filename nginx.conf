server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 進站根目錄導向 app（app 實際位於 /ui_kits/yunyin/，
    # 其相對路徑 ../../colors_and_type.css、../../assets/ 才能正確解析）
    location = / {
        return 302 /ui_kits/yunyin/;
    }

    # 確保 .jsx / .mjs 以 JavaScript MIME 提供（Babel 與 live-ai.jsx 用）
    # 並關閉快取，避免改版後被 Cloudflare/瀏覽器快取住舊檔
    location ~* \.(jsx|mjs)$ {
        default_type application/javascript;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # index.html 不快取（確保載入到最新的 script 清單）
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
